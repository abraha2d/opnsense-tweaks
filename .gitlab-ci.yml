stages:
  - test

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  PHP_IMAGE: "thecodingmachine/php:8.5-v5-cli@sha256:42215b1a124696a0c5050e68401eb20e168e511d21830f4dfcf1c096beafdb10"

default:
  interruptible: true

.php-base: &php-base
  image: $PHP_IMAGE
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  before_script:
    - composer install --no-interaction --prefer-dist --no-progress

.pest_base: &pest_base
  image: $PHP_IMAGE
  variables:
    PHP_EXTENSION_PCOV: "1"
  cache: !reference [.php-base, cache]
  before_script: !reference [.php-base, before_script]

php-lint:
  stage: test
  image: $PHP_IMAGE
  needs: []
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - php --version
    - git ls-files -- '*.php' '*.inc' | xargs -r php -l

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable@sha256:c82fe42504fbc9fc68f15d36638e5ee2324ebb8b94e96a3c4e395bf361c49183
  needs: []
  script:
    - shellcheck --version
    - find . \( -path ./external -prune -o -path ./vendor -prune -o -path ./.git -prune \) -o -type f -exec grep -l '^#!/.*sh' {} \; | xargs -r shellcheck

lint:format:
  extends: .php-base
  stage: test
  needs: []
  script:
    - php --version
    - vendor/bin/pint --test

analyse:phpstan:
  extends: .php-base
  stage: test
  needs: []
  script:
    - php --version
    - vendor/bin/phpstan analyse --memory-limit=1G

pest:unit:
  <<: *pest_base
  stage: test
  needs: []
  script:
    - php --version
    - ./vendor/bin/pest --testsuite=Unit --colors=always --ci --log-junit=junit-unit.xml --coverage-php=coverage-unit.cov
  artifacts:
    when: always
    reports:
      junit: junit-unit.xml
    paths:
      - coverage-unit.cov
      - junit-unit.xml

pest:integration:
  <<: *pest_base
  stage: test
  needs: []
  script:
    - php --version
    - tools/fake-root.sh ./vendor/bin/pest --testsuite=Integration --colors=always --ci --log-junit=junit-integration.xml --coverage-php=coverage-integration.cov
  artifacts:
    when: always
    reports:
      junit: junit-integration.xml
    paths:
      - coverage-integration.cov
      - junit-integration.xml

coverage:merge:
  stage: test
  extends: .php-base
  needs: [pest:unit, pest:integration]
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
    policy: pull
  coverage: '/Total:\s*\d+\.\d+\s*%/'
  before_script: !reference [.php-base, before_script]
  script:
    - php --version
    - ls -lh coverage-unit.cov coverage-integration.cov || (echo "missing coverage" && exit 1)
    - mkdir -p build/coverage && cp coverage-unit.cov build/coverage/unit.cov && cp coverage-integration.cov build/coverage/integration.cov
    - vendor/bin/phpcov merge --cobertura coverage.cobertura.xml --text coverage.txt build/coverage
    - cat coverage.txt
  artifacts:
    when: always
    reports:
      junit:
        - junit-unit.xml
        - junit-integration.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.cobertura.xml
    paths:
      - coverage.cobertura.xml
      - coverage.txt
