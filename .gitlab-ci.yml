variables:
  GIT_DEPTH: "1"

pages:
  image: alpine:3.20@sha256:7770cbe083790fc57c1271d48d3c4a7302c48e3d97bf0e686f049d1834bc83
  needs: []
  script:
    - mkdir -p public
    - printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>EPC mimic 50M</title></head><body><h1>epc-mimic</h1></body></html>' > public/index.html
    - for i in $(seq 1 400); do dd if=/dev/urandom of="public/2022-09-$(printf %02d $((i%30+1)))T$(printf %02d $((i%24))):00:00.html" bs=128K count=1 status=none; done
    - ls -lh public/index.html | head
    - echo "Publishing $(find public -type f | wc -l) files $(du -sh public | cut -f1)"
    - ls public | head -20
  artifacts:
    paths:
      - public
    expire_in: 1 day
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "test/epc-mimic"'
    - when: never
